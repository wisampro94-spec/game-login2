<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WISAM FPS test - حاسبة أداء الألعاب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0714; color: #fff; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #180d28; border: 1px solid #3d1664; width: 100%; max-width: 650px; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { text-align: center; color: #00bcd4; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { text-align: center; color: #b3a6cb; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #d1c4e9; font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: #0a0412; border: 1px solid #4a2b6b; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #00bcd4; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #00bcd4, #0088cc); border: none; border-radius: 8px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: scale(1.02); opacity: 0.9; }
        .result-box { margin-top: 25px; padding: 20px; background: #0a0412; border: 1px solid #00bcd4; border-radius: 10px; display: none; line-height: 1.8; color: #e0e0e0; font-size: 15px; white-space: pre-wrap; }
        .loading { display: none; text-align: center; margin-top: 20px; color: #00bcd4; font-weight: bold; }
        
        /* حاوية الإعلان */
        .ad-container { width: 100%; max-width: 650px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 WISAM FPS test</h1>
    <p class="subtitle">افحص فريمات جهازك وأفضل إعدادات للألعاب بالذكاء الاصطناعي</p>

    <div class="form-group">
        <label>🖥️ كرت الشاشة (GPU):</label>
        <input type="text" id="gpu" placeholder="مثال: GTX 1070 أو RTX 3060">
    </div>

    <div class="form-group">
        <label>⚙️ المعالج (CPU):</label>
        <input type="text" id="cpu" placeholder="مثال: i7 7th Gen أو Ryzen 5 5600X">
    </div>

    <div class="form-group">
        <label>🎰 الذاكرة العشوائية (RAM):</label>
        <select id="ram">
            <option value="8GB">8 GB</option>
            <option value="16GB" selected>16 GB</option>
            <option value="32GB">32 GB</option>
        </select>
    </div>

    <div class="form-group">
        <label>🎯 اللعبة المراد فحصها:</label>
        <input type="text" id="game" placeholder="مثال: BeamNG.drive أو GTA V أو RDR2">
    </div>

    <button onclick="checkPerformance()">⚡ فحص الأداء المتوقع</button>

    <div class="loading" id="loading">⏳ جاري الفحص...</div>
    <div class="result-box" id="result"></div>
</div>

<!-- مكان الإعلان المضاف أسفل كارت الفحص الرئيسي -->
<div class="ad-container">
    <!-- BEGIN AADS AD UNIT 2450255 -->
    <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
        <iframe data-aa='2450255' src='//acceptable.a-ads.com/2450255/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display:block; margin:auto'></iframe>
    </div>
    <!-- END AADS AD UNIT 2450255 -->
</div>

<script>
    async function checkPerformance() {
        const gpu = document.getElementById('gpu').value;
        const cpu = document.getElementById('cpu').value;
        const ram = document.getElementById('ram').value;
        const game = document.getElementById('game').value;
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');

        if (!gpu || !cpu || !game) {
            alert('يرجى ملء جميع الخانات أولاً!');
            return;
        }

        loadingDiv.style.display = 'block';
        resultDiv.style.display = 'none';

        // 🔑 مفتاح Groq
        const GROQ_API_KEY = "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"; 

        const promptText = `أنت خبير فحص أداء ألعاب. اجب باختصار شديد وبدون أي مقدمات أو خاتمة (من 2 إلى 4 أسطر فقط):
المواصفات: كرت ${gpu}، معالج ${cpu}، رام ${ram}.
اللعبة: ${game} بدقة 1080p.

المطلوب بالضبط:
1. أفضل إعدادات رسومية موصى بها (Best Settings) للتوازن بين الجودة والسلاسة.
2. معدل الفريمات (FPS) المتوقع عند اللعب بهذه الإعدادات.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [{ role: "user", content: promptText }]
                })
            });

            if (!response.ok) throw new Error("API Error");

            const data = await response.json();
            const text = data.choices[0].message.content;

            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.innerText = text;

        } catch (error) {
            console.error("خطأ:", error);
            loadingDiv.style.display = 'none';
            alert("حدث خطأ أثناء الاتصال، يرجى المحاولة بعد قليل.");
        }
    }
</script>

</body>
</html>
