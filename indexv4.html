<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WISAM - لتنزيل الألعاب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1e0938;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* طبقة صورة غلاف الألعاب المتحركة بالخلفية */
        .bg-animated {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            /* استخدام صورة بوسترات ألعاب مباشرة مع إمكانية استبدالها بـ bg.jpg إن أردت */
            background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1600&auto=format&fit=crop'), url('bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.35; /* زيادة الشفافية حتى تظهر الألعاب بوضوح ممتاز */
            z-index: 0;
            filter: contrast(1.1);
            animation: floatBackground 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* طبقة تدرج أرجواني لتناسق الألوان مع الصورة */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(61, 22, 100, 0.5) 0%, rgba(20, 5, 38, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* الشعار في الأعلى */
        .logo-container {
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInDown 1s ease;
        }
        .logo-container h1 {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00bcd4;
            text-shadow: 0 0 15px rgba(0, 188, 212, 0.6);
        }
        .logo-container p {
            font-size: 13px;
            color: #d1c4e9;
            margin-top: 2px;
        }

        /* المحتوى الرئيسي */
        .main-content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* جهة اليمين: النصوص */
        .right-box {
            text-align: right;
            max-width: 420px;
            animation: fadeInRight 1s ease;
        }
        .right-box h2 {
            font-size: 40px;
            font-weight: bold;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }
        .highlight-box {
            display: inline-block;
            background-color: #ff3d57;
            color: #ffffff;
            padding: 8px 22px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(255, 61, 87, 0.6);
            animation: pulseGlow 2s infinite;
        }

        /* جهة اليسار: اللابتوب وزر تسجيل الدخول */
        .left-box {
            position: relative;
            width: 480px;
            max-width: 100%;
            animation: fadeInLeft 1s ease;
        }
        .laptop-screen {
            background-color: rgba(20, 10, 32, 0.92);
            border: 8px solid #4a2b6b;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            height: 270px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .laptop-screen::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(0,188,212,0.15) 0%, transparent 70%);
            animation: rotateGlow 10s linear infinite;
        }
        .controller-icon {
            font-size: 48px;
            margin-bottom: 12px;
            animation: floatIcon 2s ease-in-out infinite;
            z-index: 2;
        }
        .login-btn {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #00bcd4, #008ba3);
            color: #ffffff;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(0, 188, 212, 0.5);
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(0, 188, 212, 0.8);
            background: linear-gradient(135deg, #00e5ff, #00bcd4);
        }
        .laptop-base {
            background-color: #593382;
            height: 18px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
        }
        .laptop-notch {
            width: 80px;
            height: 5px;
            background-color: #1e0938;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        /* الفوتر السفلي */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #d1c4e9;
            position: relative;
            z-index: 2;
        }
        .footer-badge {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* تأثيرات الحركة (Animations) */
        @keyframes floatBackground {
            0% {
                transform: scale(1) translate(0, 0);
            }
            50% {
                transform: scale(1.08) translate(-2%, -2%);
            }
            100% {
                transform: scale(1.04) translate(2%, 1%);
            }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- خلفية الصورة المتحركة + طبقة التدرج -->
    <div class="bg-animated"></div>
    <div class="bg-overlay"></div>

    <!-- الشعار في الأعلى -->
    <div class="logo-container">
        <h1>WISAM</h1>
        <p>لتنزيل الالعاب</p>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <!-- جهة اليمين: النصوص -->
        <div class="right-box">
            <h2>تنزيل الالعاب المكركه</h2>
            <div class="highlight-box">والمودات</div>
        </div>

        <!-- جهة اليسار: شاشة اللابتوب وبداخلها زر تسجيل الدخول -->
        <div class="left-box">
            <div class="laptop-screen">
                <div class="controller-icon">🎮</div>
                <a href="https://wisampro94-spec.github.io/game-login/" class="login-btn">
                    <span>🔑</span> تسجيل الدخول للتحميل
                </a>
            </div>
            <div class="laptop-base">
                <div class="laptop-notch"></div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <div class="footer">
        <div class="footer-badge">wisamgames.net</div>
        <div>جميع الحقوق محفوظة</div>
    </div>

</body>
</html>
